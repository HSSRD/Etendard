# Contrôle d'écart des pages de projet (ADR 0016, ticket #103) : chaque lundi, compare les sources
# relevées dans src/content/projets/ à leur repo (pnpm dragon:ecart) et ouvre un ticket quand une
# section est à relire. Le ticket ne reprend que le rapport du script : chemins et SHA, jamais le
# contenu du repo source.
name: dragon-ecart

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # Lance le code du repo : jeton en lecture seule, jamais celui qui écrit les tickets (ADR 0011).
  ecart:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.ecart.outputs.code }}
      rapport: ${{ steps.ecart.outputs.rapport }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Le script n'importe que node:fs et le contenu : ni pnpm ni dépendances à installer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Comparer les sources
        id: ecart
        env:
          # Requêtes anonymes limitées par IP, partagée entre les runners de GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=0
          node scripts/dragon-ecart.ts > rapport.md || code=$?
          cat rapport.md
          # Node sort aussi en 1 sur une erreur non rattrapée, sans rien écrire sur la sortie standard.
          if [ "$code" = 1 ] && [ ! -s rapport.md ]; then code=2; fi
          fin="FIN_$(openssl rand -hex 8)"
          {
            echo "code=$code"
            echo "rapport<<$fin"
            cat rapport.md
            echo "$fin"
          } >> "$GITHUB_OUTPUT"
          # 2 : contrôle impossible, le run échoue pour le signaler.
          [ "$code" -le 1 ]

  # Écrit les tickets sans lancer de code du repo.
  ticket:
    needs: ecart
    if: needs.ecart.outputs.code == '1'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter le ticket
        env:
          GH_TOKEN: ${{ github.token }}
          RAPPORT: ${{ needs.ecart.outputs.rapport }}
          TITRE: 'Écarts entre le site et ses sources de projet'
        run: |
          printf '%s\n' "$RAPPORT" > rapport.md
          # Seulement un ticket ouvert par ce workflow : le repo est public, n'importe qui peut en ouvrir un.
          numero=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --author 'github-actions[bot]' \
            --json number,title --jq "map(select(.title == env.TITRE))[0].number // empty")
          if [ -n "$numero" ]; then
            gh issue comment "$numero" -R "$GITHUB_REPOSITORY" --body-file rapport.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITRE" --body-file rapport.md
          fi
