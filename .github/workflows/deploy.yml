# Déploie le site sur le Pi florasp à chaque push sur main (ADR 0006, ticket #5).
# Fonctionnement, secrets et rollback : infra/pi/FONCTIONNEMENT.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Revenir à la version précédente au lieu de déployer"
        type: boolean
        default: false

# Un seul déploiement ou rollback à la fois, sans annuler celui en cours.
concurrency: production

permissions: {}

jobs:
  build:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # pnpm verify lance Playwright : même image que ci.yml (ADR 0003).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Créer l'archive
        id: archive
        run: |
          echo "$GITHUB_SHA" > dist/version.txt
          tar -czf etendard.tar.gz -C dist .
          sha256sum etendard.tar.gz | tee SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            etendard.tar.gz
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0 # archive déjà compressée
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: {}
    outputs:
      servi: ${{ steps.servi.outputs.sha }}
      rollback: ${{ steps.rollback.outputs.effectue }}
      envoi: ${{ steps.envoi.outcome }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Vérifier l'empreinte SHA-256 de l'archive
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  etendard.tar.gz" | sha256sum -c -
      - &tailscale
        name: Rejoindre le tailnet (nœud éphémère tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - &ssh
        name: Configurer SSH (empreinte du Pi vérifiée)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host florasp
            User deploy
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 30
          EOF
      - name: Lire la version servie avant l'envoi
        id: before
        run: echo "sha=$(ssh florasp status || true)" >> "$GITHUB_OUTPUT"
      - name: Envoyer l'archive
        id: envoi
        run: ssh florasp < etendard.tar.gz
      # Délai propre : un status bloqué échoue ici, et le rollback tourne avant le délai du job.
      - name: Vérifier la version servie
        timeout-minutes: 2
        run: |
          served="$(ssh florasp status)"
          echo "servie : $served — attendue : $GITHUB_SHA"
          [ "$served" = "$GITHUB_SHA" ]
      # N'annule que ce que ce job a changé : si la version servie est toujours
      # celle d'avant l'envoi, un rollback reviendrait une version trop loin.
      # cancelled() : failure() vaut false si le job est annulé (à la main ou par son délai).
      - name: Revenir à la version précédente
        id: rollback
        if: (failure() || cancelled()) && steps.before.outcome == 'success'
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          now="$(ssh florasp status || true)"
          if [ -z "$now" ]; then
            echo "::error::version servie illisible, rollback non lancé"
          elif [ "$now" = "$BEFORE" ]; then
            echo "version servie inchangée ($now), rollback inutile"
          else
            ssh florasp rollback
            echo "effectue=true" >> "$GITHUB_OUTPUT"
            echo "servie après rollback : $(ssh florasp status)"
          fi
      # Version servie en fin de job, reprise dans l'e-mail de résultat.
      - &servi
        name: Lire la version servie en fin de job
        id: servi
        if: always()
        timeout-minutes: 1
        continue-on-error: true # simple lecture : ne change jamais le résultat du job
        run: echo "sha=$(ssh florasp status || true)" >> "$GITHUB_OUTPUT"

  release:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-${GITHUB_SHA::7}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag déjà publiée (redéploiement)"
          else
            gh release create "$tag" etendard.tar.gz SHA256SUMS -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

  rollback:
    if: ${{ inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions: {}
    outputs:
      servi: ${{ steps.servi.outputs.sha }}
    steps:
      - *tailscale
      - *ssh
      - name: Revenir à la version précédente
        run: |
          echo "servie avant : $(ssh florasp status)"
          ssh florasp rollback
          echo "servie après : $(ssh florasp status)"
      - *servi

  # E-mail Brevo après chaque déploiement ou rollback, quel qu'en soit le résultat (#32).
  # message exécute le script du repo sans aucun secret ; notify envoie sans code du repo.
  # Un échec laisse un avertissement sans changer le résultat du déploiement.
  message:
    needs: [deploy, release, rollback]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mail: ${{ steps.mail.outputs.json }}
    steps:
      - *checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Titres et branches restent dans l'environnement : jamais interpolés dans run.
      - name: Composer l'e-mail
        id: mail
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ inputs.rollback }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          SERVI: ${{ needs.rollback.outputs.servi || needs.deploy.outputs.servi }}
          ROLLBACK_EFFECTUE: ${{ needs.deploy.outputs.rollback }}
          ENVOI: ${{ needs.deploy.outputs.envoi }}
        run: |
          mail="$(node scripts/deploy-notify.js)"
          echo "Objet : $(jq -r .subject <<< "$mail")"
          echo "json=$mail" >> "$GITHUB_OUTPUT"

  notify:
    needs: message
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    continue-on-error: true
    permissions: {}
    steps:
      # Seuls l'objet et le corps sont repris ; jq ajoute les adresses sans les afficher.
      - name: Envoyer l'e-mail par Brevo
        env:
          MAIL: ${{ needs.message.outputs.mail }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ -z "$MAIL" ]; then
            echo "::warning::e-mail non envoyé : le job message ne l'a pas composé"
            exit 0
          fi
          if [ -z "$BREVO_API_KEY" ] || [ -z "$NOTIFY_EMAIL_FROM" ] || [ -z "$NOTIFY_EMAIL_TO" ]; then
            echo "::warning::e-mail non envoyé : secrets Brevo absents de production"
            exit 0
          fi
          if ! payload="$(jq -e --arg from "$NOTIFY_EMAIL_FROM" --arg to "$NOTIFY_EMAIL_TO" \
              '{sender: {email: $from}, to: [{email: $to}], subject, textContent, htmlContent}' <<< "$MAIL")"; then
            echo "::warning::e-mail non envoyé : sortie du job message illisible"
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "api-key: $BREVO_API_KEY" -H 'content-type: application/json' \
            --data @- https://api.brevo.com/v3/smtp/email <<< "$payload")" || code="injoignable"
          case "$code" in
            2??) echo "e-mail envoyé" ;;
            *) echo "::warning::e-mail non envoyé (Brevo : $code)" ;;
          esac
