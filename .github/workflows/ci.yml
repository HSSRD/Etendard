# Vérifie chaque PR avec `pnpm verify` (ADR 0005), dans l'image Docker officielle de
# Playwright : c'est elle qui fait foi pour les captures (ADR 0003, ticket #9).
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Même version que @playwright/test dans pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: test-results/
          retention-days: 7

  essai-captures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          printf "import { expect, test } from '@playwright/test';\ntest('capture', async ({ page }) => { await page.goto('/'); await expect(page).toHaveScreenshot('accueil.png'); });\n" > tests/essai.spec.ts
          node scripts/maj-captures.js tests/essai.spec.ts
          ls -l tests/__captures__/essai.spec.ts/
          echo "root-owned:"; find . -path ./node_modules -prune -o -user 0 -print
          node scripts/maj-captures.js tests/essai.spec.ts
