# Isolation d'un service exposé (ticket #113, ADR 0017), installée par install.sh dans
# /etc/systemd/system/<unité>.d/etendard-isolation.conf : jamais dans l'unité du paquet, qu'une mise à jour
# remplacerait. install.sh y ajoute ReadWritePaths=, les seuls dossiers où le service écrit (s'il en a).
# Chaque ligne retire au service une capacité dont ni un serveur de fichiers ni le tunnel n'ont besoin,
# pour qu'une faille n'en donne pas l'usage à un attaquant.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateDevices=yes
PrivateTmp=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# Aucune capacité root : les services écoutent sur un port non privilégié ou n'écoutent pas.
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
