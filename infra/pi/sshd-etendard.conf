# SSH par clé uniquement (ticket #113, ADR 0017), installé par install.sh dans
# /etc/ssh/sshd_config.d/00-etendard.conf : sshd garde la première valeur lue, et sshd_config inclut ce
# dossier en tête, par ordre de nom. La clé de déploiement (commande forcée) reste une clé : inchangée.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
